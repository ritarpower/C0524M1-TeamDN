<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
</head>
<body>
<h2>Welcome to the Home Page</h2>

<!-- Hiển thị thông báo và nút đăng xuất nếu người dùng đã đăng nhập -->
<div th:if="${isLoggedIn}">
    <p>Welcome, <span th:text="${username}"></span>!</p>
    <form action="/logout" method="POST">
        <button type="submit">Đăng xuất</button>
    </form>
</div>

<!-- Hiển thị liên kết đăng nhập nếu người dùng chưa đăng nhập -->
<div th:if="${not isLoggedIn}">
    <p>If you are not logged in, click the link below to log in:</p>
    <a href="/login">Đăng nhập</a>
</div>
</body>
</html>
